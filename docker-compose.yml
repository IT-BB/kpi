version: '3.9'
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: enterprise_kpi
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '3306:3306'

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: changeme
      DB_NAME: enterprise_kpi
      APP_PORT: 8080
    depends_on:
      - mysql
    ports:
      - '8080:8080'

volumes:
  mysql-data:
